# Ajuste fino do broker (design 6.10.1). Montado em
# /etc/rabbitmq/conf.d/10-hospital.conf pelo docker-compose.yml.
vm_memory_high_watermark.relative = 0.6
disk_free_limit.absolute          = 1GB
consumer_timeout                  = 120000     # 120 s; o orcamento de handler e de 10 s
heartbeat                         = 60
channel_max                       = 128
log.console.level                 = info
management.rates_mode             = basic
