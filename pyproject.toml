[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hospitalmq"
version = "0.1.0"
description = "Middleware de mensageria do Hospital Inteligente (G3): Envelope, retentativa, idempotencia, RPC sobre fila e transporte plugavel"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "Gabriel Nery da Silva Espindola" },
  { name = "Giordana de Farias Franco Bueno Bucci" },
  { name = "Gustavo Henrique Valadares" },
  { name = "Carlos Alberto Rodrigues da Silva Junior" },
  { name = "Luiz Felipe Belisario Macedo" },
]
keywords = ["middleware", "mensageria", "amqp", "rabbitmq", "sistemas-distribuidos"]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Framework :: AsyncIO",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Typing :: Typed",
]
dependencies = [
  "aio-pika>=9.4,<10",
  "structlog>=24.1",
  "pyjwt>=2.8",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
]

[project.optional-dependencies]
# Perfil "borda": api-gateway e demais processos HTTP (12.2). Inclui httpx porque o
# Cliente_Leito (clients/bedside_monitor) fala HTTP com o gateway -- o proprio comentario
# do Dockerfile lista "httpx" no grupo borda; sem ele o simulador quebra no import (12.2.3).
borda = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "sse-starlette>=2.1",
  "httpx>=0.27",
]
# Perfil "dominio": os cinco consumidores com sessao de banco (12.2, 12.3.4).
dominio = [
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["hospitalmq"]

[tool.hatch.build.targets.sdist]
include = ["hospitalmq", "pyproject.toml"]

# --------------------------------------------------------------------------- #
# Analise estatica - secao 12.10.1 do design                                    #
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs", "slides", "specs", "memory-bank", "instrucoes"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "ANN", "D", "ASYNC", "RUF"]
ignore = ["D203", "D213"] # conflitos entre convencoes de docstring

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "D", "S101"]  # testes nao exigem anotacao nem docstring
"services/*" = ["D"]              # docstring obrigatoria apenas no middleware
"clients/*" = ["D"]
"scripts/*" = ["D", "ANN"]

# Depends/Security/Query/... em default e o padrao idiomatico do FastAPI; B008 e falso
# positivo aqui. Restrito as chamadas do framework, nao um "ignore" geral de B008.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  "fastapi.Depends", "fastapi.Security", "fastapi.Query", "fastapi.Path",
  "fastapi.Header", "fastapi.Body", "fastapi.Cookie", "fastapi.Form", "fastapi.File",
  "Depends", "Security", "Query", "Path", "Header", "Body", "Cookie", "Form", "File",
  # fabrica de dependencia parametrizada do proprio gateway (mesmo padrao do Depends)
  "dependencias.exigir_papel", "exigir_papel",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["hospitalmq"] # rigor maximo apenas no artefato avaliado

# Os drivers concretos sao importados sob demanda dentro de criar_transporte (secao 4.3.4):
# o nucleo nao depende deles em tempo de import, e sqs.py e projetado, nao implantado (C4).
[[tool.mypy.overrides]]
module = [
  "hospitalmq.transport.amqp",
  "hospitalmq.transport.memory",
  "hospitalmq.transport.sqs",
]
ignore_missing_imports = true

# --------------------------------------------------------------------------- #
# Testes e cobertura - secao 10.8.2 do design                                   #
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/unit", "tests/integration"] # o padrao exclui broker e e2e
addopts = "-q --strict-markers --strict-config --durations=10"
markers = [
  "unit: roda em processo, sem I/O externo",
  "integration: varios componentes juntos sobre MemoryTransport, sem Docker",
  "broker: exige RabbitMQ e PostgreSQL de teste",
  "e2e: exige a stack completa do docker compose",
  "requisito(id): criterio de aceitacao verificado, ex.: requisito('R2.3')",
]

[tool.coverage.run]
source = ["hospitalmq", "services", "clients"]
branch = true
omit = ["hospitalmq/transport/sqs.py"] # projetado e nao implantado por C4; ver secao 11

[tool.coverage.report]
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "^\\s*\\.\\.\\.$",
  "raise NotImplementedError",
]
